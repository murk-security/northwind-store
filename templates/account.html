<section class="narrow">
  <h1>My account</h1>
  <dl class="profile">
    <dt>Name</dt><dd>{{name}}</dd>
    <dt>Email</dt><dd>{{email}}</dd>
    <dt>Role</dt><dd>{{role}}</dd>
    <dt>SSN</dt><dd>{{ssn}}</dd>
    <dt>API key</dt><dd><code>{{api_key}}</code></dd>
  </dl>
  {{admin_link}}
  <p class="muted">Your API key authenticates requests to the Northwind API.</p>
  <p class="muted"><a href="/index.php">← Back to store</a></p>
</section>
